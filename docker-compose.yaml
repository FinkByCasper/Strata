# Strata. This file is written for Coolify (Docker Compose build pack): Coolify assigns the domain, terminates
# HTTPS and generates the password, so nothing is published on the host here.
#
#   Coolify:  New resource -> Docker Compose -> this repo. Put your domain on the "strata" service (port 3001).
#             The login password is generated for you: see STRATA_PASSWORD / SERVICE_PASSWORD_STRATA in the
#             Environment Variables tab (change it there if you like). Login name: strata.
#   Plain Docker (no Coolify):  see README ("Hosting it online"); docker-compose.override.yaml publishes the port.
services:
  strata:
    build: .
    restart: unless-stopped
    environment:
      # Coolify: gives the service its domain (routed to port 3001) and exposes it in the UI.
      SERVICE_FQDN_STRATA_3001: ""
      # Coolify generates this password once. Without a password the editor would be open to the internet.
      STRATA_PASSWORD: ${SERVICE_PASSWORD_STRATA}
      STRATA_USER: ${STRATA_USER:-strata}
    expose:
      - "3001"
    volumes:
      - strata-data:/data          # the SQLite database lives here: back this volume up
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  strata-data:
